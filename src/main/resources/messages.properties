* **Hatchback (\u101F\u1010\u103A\u1001\u103A\u1018\u1010\u103A):** \u1014\u1031\u102C\u1000\u103A\u1016\u102F\u1036\u1038\u1010\u1036\u1001\u102B\u1038\u1021\u1015\u102B\u1021\u101D\u1004\u103A \u1010\u1036\u1001\u102B\u1038 \u1045 \u1015\u1031\u102B\u1000\u103A\u1015\u102B\u1015\u103C\u102E\u1038 \u1000\u102C\u1038\u1021\u1014\u1031\u102C\u1000\u103A\u1015\u102D\u102F\u1004\u103A\u1038 \u1010\u102D\u102F\u1010\u102D\u102F\u101C\u1031\u1038\u1014\u103E\u1004\u1037\u103A \u1000\u103B\u1005\u103A\u101C\u103B\u1005\u103A\u101E\u1031\u102C \u1000\u102C\u1038\u1021\u1019\u103B\u102D\u102F\u1038\u1021\u1005\u102C\u1038 (\u1025\u1015\u1019\u102C- Toyota Vitz, Honda Fit)\u104B
* **Pick-up Truck (\u1015\u1005\u103A\u1000\u1015\u103A):** \u1000\u102F\u1014\u103A\u1015\u1005\u1039\u1005\u100A\u103A\u1038\u1019\u103B\u102C\u1038 \u101E\u101A\u103A\u1006\u1031\u102C\u1004\u103A\u101B\u1014\u103A \u1021\u1014\u1031\u102C\u1000\u103A\u1010\u103D\u1004\u103A \u1021\u1019\u102D\u102F\u1038\u1016\u103D\u1004\u1037\u103A \u1010\u102F\u1036\u1015\u102B\u101B\u103E\u102D\u101E\u100A\u1037\u103A \u1000\u102C\u1038 (\u1025\u1015\u1019\u102C- Toyota Hilux)\u104B

